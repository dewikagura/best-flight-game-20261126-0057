<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cendrawasih Airlift — Papua Bush Courier</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript><p style="color:#fff;text-align:center;padding:2em">Cendrawasih Airlift needs JavaScript — the whole game is code. Please enable it and reload.</p></noscript>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="help">
    <span><b>↑ / ↓</b> pitch</span>
    <span><b>← / →</b> throttle</span>
    <span><b>F</b> flaps</span>
    <span><b>G</b> gear</span>
    <span><b>B</b> brakes</span>
    <span><b>X</b> drop cargo</span>
    <span><b>P</b> pause</span>
    <span><b>M</b> mute</span>
  </div>
</div>
<script src="src/flight-model.js"></script>
<script src="src/islands.js"></script>
<script src="src/campaign.js"></script>
<script src="src/soundscape.js"></script>
<script src="src/controls.js"></script>
<script src="src/cockpit.js"></script>
<script src="src/scenery.js"></script>
<script src="src/boot.js"></script>
</body>
</html>
